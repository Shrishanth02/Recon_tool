# nginx config for serving the RECON-X SPA.
#
# The frontend is a static single-page app. It talks to the backend directly
# via VITE_API_BASE (baked at build time), so nginx does NOT proxy /api here —
# it only serves static files and falls back to index.html for client-side
# routes.

server {
    # 8080 (not 80): the image runs nginx as the unprivileged uid 101, which
    # cannot bind ports <1024. The host publishes 5173 -> 8080 (see compose).
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # --- Security headers (STEP 4) ----------------------------------------- #
    # Served on every response (add_header is inherited by nested locations that
    # do not declare their own add_header). The CSP keeps a strict script-src
    # 'self' — the former inline theme <script> was extracted to /theme-init.js so
    # no 'unsafe-inline' is needed for scripts. style-src allows 'unsafe-inline'
    # for React's inline styles + Google Fonts (style injection is low risk).
    # connect-src permits the API/WS origin over TLS (its host is deployment-
    # specific; tighten to your exact api origin if it is fixed). Scan-derived
    # report HTML is additionally rendered in a sandboxed iframe by the SPA.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # gzip static assets for faster loads.
    gzip              on;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    # SPA fallback: serve the requested file if it exists, otherwise hand back
    # index.html so the client-side router can handle the path.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived caching for fingerprinted build assets. nginx does NOT inherit
    # the server-level add_header set into a location that declares its own, so
    # re-assert nosniff here (the one resource-level header that matters for
    # served JS/CSS; CSP/frame-ancestors apply to documents, not sub-resources).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
}
