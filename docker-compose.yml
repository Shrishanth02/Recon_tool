# RECON-X — Phase 0 container stack.
#
# Services:
#   postgres  - primary datastore (Phase 0 migrates off SQLite)
#   redis     - queue/broker backend (used by arq in Phase 2)
#   backend   - FastAPI API (uvicorn on :8002)
#   frontend  - static SPA served by nginx (:80), published on host :5173
#
# A worker service placeholder is included (commented out) for Phase 2.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: reconx
      POSTGRES_USER: reconx
      # REQUIRED — no default. Set POSTGRES_PASSWORD in your .env to a strong
      # value; compose refuses to start otherwise.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # NOTE: the Postgres port is intentionally NOT published to the host. The
    # backend/worker reach it over the compose network as host "postgres".
    # Uncomment only for local DB inspection, never in production.
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reconx -d reconx"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    # Require a password (from .env, like POSTGRES_PASSWORD). Compose refuses to
    # start if REDIS_PASSWORD is unset. The credential comes from the environment
    # — never hard-coded here.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env - e.g. openssl rand -hex 32}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    # NOTE: the Redis port is intentionally NOT published to the host. The
    # backend/worker reach it over the compose network as host "redis".
    # Uncomment ONLY for local inspection (still password-protected, bound to
    # localhost) — never in production.
    # ports:
    #   - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    # --- Runtime hardening (P1-B3) ------------------------------------------ #
    # Non-root is set in the image (USER reconx). Drop every Linux capability
    # (the default scan profiles need none) and forbid privilege escalation.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Resource limits so one runaway scan cannot take down the host. Conservative
    # defaults sized for MAX_CONCURRENT_SCANS=4 (nuclei is the heaviest, ~300MB);
    # override per deployment via .env. Honored by `docker compose up` (Compose v2).
    mem_limit: ${BACKEND_MEM_LIMIT:-2g}
    cpus: ${BACKEND_CPUS:-2.0}
    pids_limit: ${BACKEND_PIDS_LIMIT:-512}
    # Readiness = the API answers AND the database is reachable (GET /ready runs
    # SELECT 1). Uses python (always present); non-destructive; leaks nothing.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8002/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    # PENDING DOCKER VERIFICATION — read-only root filesystem. NOT enabled by
    # default: it must first be confirmed the scanner toolchain tolerates it
    # (nuclei downloads templates under $HOME on first run). To enable:
    #   read_only: true
    #   tmpfs:
    #     - /tmp:size=512m,mode=1777
    #   volumes:
    #     - reconx_home:/home/reconx   # persist tool cache/templates (declare under top-level volumes:)
    environment:
      # psycopg v3 driver (matches psycopg[binary] in requirements.txt).
      DATABASE_URL: postgresql+psycopg://reconx:${POSTGRES_PASSWORD}@postgres:5432/reconx
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env - e.g. openssl rand -hex 32}
      DEBUG: ${DEBUG:-false}
      # Phase 2 execution core & safety gates. The app reads the RECONX_*
      # aliases; the compose-level names come from .env. Defaults keep the
      # verified Phase 0/1 inline flow (no queue, no docker sandbox).
      RECONX_EXECUTION_BACKEND: ${EXECUTION_BACKEND:-inline}
      RECONX_SANDBOX: ${SANDBOX_MODE:-process}
      RECONX_SANDBOX_REQUIRED: ${SANDBOX_REQUIRED:-false}
      RECONX_REQUIRE_VERIFIED_ASSET: ${REQUIRE_VERIFIED_ASSET:-false}
      RECONX_BLOCK_PRIVATE_TARGETS: ${BLOCK_PRIVATE_TARGETS:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8002:8002"

  frontend:
    build:
      context: ./frontend
      args:
        # Browser-facing base URL. The SPA runs in the user's browser, so this
        # must be reachable from the host, not the compose-internal hostname.
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8002}
    restart: unless-stopped
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8002}
    depends_on:
      - backend
    ports:
      - "5173:80"

  # --- Phase 2 background scan worker ----------------------------------------
  # Pulls scan jobs off Redis and runs them out of process. Built from a
  # dedicated image that bundles the scanner toolchain (nmap + subfinder /
  # httpx / nuclei / ffuf). Shares the backend's env, but forces the queue
  # execution backend regardless of the backend's own EXECUTION_BACKEND.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    # --- Runtime hardening (P1-B3) — same model as backend ------------------ #
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: ${WORKER_MEM_LIMIT:-2g}
    cpus: ${WORKER_CPUS:-2.0}
    pids_limit: ${WORKER_PIDS_LIMIT:-512}
    # Readiness = the worker can reach the Redis queue backend (non-destructive
    # PING via the configured, authenticated REDIS_URL). No HTTP server here.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,redis; redis.Redis.from_url(os.environ['REDIS_URL']).ping()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # PENDING DOCKER VERIFICATION — read-only root filesystem (see backend note).
    environment:
      DATABASE_URL: postgresql+psycopg://reconx:${POSTGRES_PASSWORD}@postgres:5432/reconx
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env - e.g. openssl rand -hex 32}
      DEBUG: ${DEBUG:-false}
      # This service IS the queue backend.
      RECONX_EXECUTION_BACKEND: queue
      RECONX_SANDBOX: ${SANDBOX_MODE:-process}
      RECONX_SANDBOX_REQUIRED: ${SANDBOX_REQUIRED:-false}
      RECONX_REQUIRE_VERIFIED_ASSET: ${REQUIRE_VERIFIED_ASSET:-false}
      RECONX_BLOCK_PRIVATE_TARGETS: ${BLOCK_PRIVATE_TARGETS:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
