{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "reconx.secretName" . }}
  labels:
    {{- include "reconx.labels" . | nindent 4 }}
type: Opaque
stringData:
  # JWT signing secret consumed by the backend.
  jwt-secret: {{ .Values.env.jwtSecret | quote }}
  # Self-hosted licensing key.
  license-key: {{ .Values.env.licenseKey | quote }}
  # Resolved connection strings (derived in _helpers.tpl).
  database-url: {{ include "reconx.databaseUrl" . | quote }}
  redis-url: {{ include "reconx.redisUrl" . | quote }}
  {{- if .Values.postgresql.enabled }}
  # Database credentials for the in-cluster PostgreSQL.
  db-username: {{ .Values.postgresql.auth.username | quote }}
  db-password: {{ .Values.postgresql.auth.password | quote }}
  db-name: {{ .Values.postgresql.auth.database | quote }}
  {{- end }}
{{- end }}
