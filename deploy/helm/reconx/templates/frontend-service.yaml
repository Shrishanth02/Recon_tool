apiVersion: v1
kind: Service
metadata:
  name: {{ include "reconx.fullname" . }}-frontend
  labels:
    {{- include "reconx.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type | default .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "reconx.componentSelectorLabels" (dict "root" . "component" "frontend") | nindent 4 }}
