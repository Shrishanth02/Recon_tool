# Alembic configuration for RECON-X.
#
# The database URL is NOT set here; migrations/env.py reads it from
# app.config.settings.DATABASE_URL so a single source of truth serves both the
# app and migrations (SQLite locally, Postgres in production).

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Use OS-local time for generated revision timestamps.
timezone =

[post_write_hooks]

# --------------------------------------------------------------------------- #
# Logging
# --------------------------------------------------------------------------- #
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
