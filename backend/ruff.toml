line-length = 100
target-version = "py311"

[lint]
# EXPLICIT, pinned rule selection. Previously this file had no `select`, so the
# enforced set was whatever the installed Ruff defaulted to — and Ruff 0.16.x
# silently widened that default to hundreds of style/modernization rules,
# reddening CI on long-standing, intentional conventions. Pin Ruff's DOCUMENTED
# default so a version bump can never again change what CI enforces:
#   F   — pyflakes: real bugs (unused/undefined/shadowed names, bad f-strings)
#   E4  — pycodestyle import errors      E7 — statement errors (incl. E711/E712
#   E9  — syntax / IO errors                  `== None`, E722 bare-except)
#
# Deliberately NOT selected — these flag INTENTIONAL project conventions, not
# defects, and enabling them would mean rewriting the app (out of scope):
#   * B008   — FastAPI `Depends()` / `require_role()` in argument defaults: the
#              framework's idiomatic dependency injection. PRESERVED on purpose.
#   * BLE001 — broad `except Exception` backing the never-crash resilience
#              contracts in scanners / connectors / pipeline (always logged).
#   * UP*    — annotation/style modernization (`Optional[X]` vs `X | None`, …):
#              style, not correctness.
# Security rules are NOT globally suppressed: the pyflakes/pycodestyle-error set
# above is enforced everywhere, and no `# noqa` blanket or `S`-rule ignore hides
# a real finding.
select = ["E4", "E7", "E9", "F"]

# Cosmetic pycodestyle-statement rules only (style, not bugs). The E7 CORRECTNESS
# rules (E711/E712/E713/E714/E722 …) remain enforced.
ignore = [
    "E702",  # multiple statements on one line (semicolon)
    "E731",  # assigning a lambda to a variable
    "E741",  # ambiguous single-char variable name (l/I/O)
]

[lint.per-file-ignores]
# Generated Alembic migrations: long autogenerated lines are acceptable.
"migrations/**" = ["E501"]
# Package __init__.py files intentionally re-export names (that IS the F401).
"__init__.py" = ["F401"]
# pytest fixtures passed as test-function parameters read to Ruff's F811 as a
# "redefinition" of the module-level fixture — a known false positive, not a bug.
"tests/**" = ["F811"]
