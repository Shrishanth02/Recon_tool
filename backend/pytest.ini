[pytest]
# Bare `pytest` (e.g. CI's `pytest -q`, run from this backend/ dir) collects ONLY
# the tests/ tree — never application code. This is what keeps a bare run from
# importing modules under app/ during collection.
testpaths = tests
# A test file must be named `test_*.py`. We deliberately DROP pytest's default
# `*_test.py` pattern: production modules are allowed to be named that way
# (e.g. app/scanners/waf_test.py, the WAF-test scanner), and this guarantees such
# a module is never collected as a test even if pytest is pointed at app/ code.
python_files = test_*.py
asyncio_mode = auto
markers =
    postgres: migration/schema checks that require a live PostgreSQL (set RECONX_PG_TEST_URL). Skipped locally as PENDING CI POSTGRES VERIFICATION.
